name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Resolve dependencies
        run: go mod tidy
      - name: Vet and build
        run: |
          go vet ./...
          go build -o surf-api .
      - name: Run server and smoke test
        run: |
          ./surf-api > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/.well-known/health >/dev/null && break; sleep 1; done
          ./smoke_test.sh
      - name: Server log
        if: always()
        run: cat server.log || true
      - name: Commit go.sum
        if: success()
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: add go.sum from CI"
            git push
          fi
